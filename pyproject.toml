[project]
name = "sophons"
version = "0.1.0"
description = "Agent memory and retrieval SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api>=1.26", "lazy-loader>=0.4", "pydantic>=2.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
pdf-structure = ["pymupdf4llm>=0.3"]
ocr = ["pypdf>=4", "pypdfium2>=4", "pytesseract>=0.3.10", "pillow>=10"]
openai = ["openai>=1.0"]
deepseek = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
otel = ["opentelemetry-sdk>=1.26", "opentelemetry-exporter-otlp-proto-http>=1.26"]
tavily = ["tavily-python>=0.3"]
chroma = ["chromadb>=1.0"]
numpy = ["numpy>=1.26"]
bedrock = ["boto3>=1.35"]
sentence-transformers = ["sentence-transformers>=3.0"]
cli = ["rich>=13", "prompt-toolkit>=3"]
all = ["openai>=1.0", "anthropic>=0.40", "pydantic>=2.0", "opentelemetry-sdk>=1.26", "opentelemetry-exporter-otlp-proto-http>=1.26", "tavily-python>=0.3", "chromadb>=1.0", "numpy>=1.26", "sentence-transformers>=3.0", "rich>=13", "prompt-toolkit>=3","boto3>=1.35"]

[dependency-groups]
dev = [
    "numpy>=1.26",
    "opentelemetry-sdk>=1.26",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
